<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boostinger — Website Design & Development</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1c1610 0%, #0b0b0d 60%);
    color: #f2f2f2;
    padding: 24px;
    text-align: center;
  }
  .wrap { max-width: 460px; width: 100%; }
  h1 {
    font-size: 34px;
    margin: 0 0 8px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #f5b942, #ff7a00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tag { color: #999; font-size: 14px; margin-bottom: 32px; }
  p { color: #bbb; font-size: 15px; line-height: 1.6; }
  .btn {
    display: inline-block;
    margin-top: 28px;
    padding: 16px 28px;
    border-radius: 10px;
    background: linear-gradient(90deg, #f5b942, #ff7a00);
    color: #0b0b0d;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-decoration: none;
  }
  .btn:active { opacity: 0.85; }
  .fine { font-size: 12px; color: #666; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>BOOSTINGER</h1>
    <div class="tag">Website Design &amp; Development</div>
    <p>Ready to get started? We'll walk you through the service agreement, your package options, and secure payment — all in one place.</p>
    <a class="btn" href="/pay">Start Your Project →</a>
    <p class="fine">Questions? getboostinger@gmail.com · (951) 428-1407</p>
  </div>
</body>
</html>
