<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - Boostinger</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      /* --- Reset & Base --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #0a0a0a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
        background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
      }

      /* --- Animations --- */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in {
        animation: fadeInUp 1s ease-out forwards;
        opacity: 0;
      }

      .delay-1 { animation-delay: 0.2s; }
      .delay-2 { animation-delay: 0.4s; }
      .delay-3 { animation-delay: 0.6s; }

      /* --- Components --- */
      .logo {
        max-width: 250px;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 20px rgba(255, 102, 0, 0.3));
        margin-bottom: 2rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #ffffff 0%, #ff8c00 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #b0b0b0;
        font-size: 1rem;
        margin-bottom: 2rem;
        max-width: 600px;
      }

      .section-container {
        max-width: 600px;
        width: 100%;
        margin: 2rem auto;
        padding: 2.5rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 102, 0, 0.15);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(4px);
        text-align: left;
      }

      .section-title {
        font-size: 1.5rem;
        color: #ff8c00;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
      }

      /* --- Form Styling --- */
      .payment-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-group label {
        font-size: 0.85rem;
        color: #ff8c00;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .form-group input, .form-group select {
        padding: 15px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.5);
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        font-size: 1rem;
        transition: all 0.3s ease;
        width: 100%;
      }

      .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: #ff8c00;
        box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
        background: rgba(0, 0, 0, 0.8);
      }

      .form-group input::placeholder {
        color: #555;
      }

      .row {
        display: flex;
        gap: 1rem;
      }

      .row .form-group {
        flex: 1;
      }

      /* --- Order Summary --- */
      .order-summary {
        background: rgba(255, 102, 0, 0.05);
        border: 1px solid rgba(255, 102, 0, 0.2);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.8rem;
        color: #d0d0d0;
        font-size: 0.95rem;
      }

      .summary-item.total {
        margin-bottom: 0;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 102, 0, 0.3);
        color: #ffffff;
        font-weight: 700;
        font-size: 1.2rem;
      }

      .summary-item.total span:last-child {
        color: #ff8c00;
      }

      /* --- CTA Button --- */
      .cta-button {
        display: block;
        width: 100%;
        background: linear-gradient(90deg, #ff5e00, #ff9500);
        border: none;
        padding: 18px 45px;
        border-radius: 50px;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        color: #ffffff;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
        text-decoration: none;
        margin-top: 1rem;
        text-align: center;
      }

      .cta-button:hover {
        transform: scale(1.02);
        box-shadow: 0 0 25px rgba(255, 102, 0, 0.7);
      }

      .secure-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #666;
      }

      .secure-note svg {
        width: 16px;
        height: 16px;
        fill: #ff8c00;
      }

      .back-link {
        display: inline-block;
        margin-top: 1.5rem;
        color: #888;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s;
      }

      .back-link:hover {
        color: #ff8c00;
      }

      footer {
        margin-top: 3rem;
        font-size: 0.8rem;
        color: #444;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Header -->
      <img src="logo.png" alt="Boostinger Logo" class="logo fade-in">
      <h1 class="fade-in delay-1">Secure Checkout</h1>
      <p class="subtitle fade-in delay-2">Complete your payment to launch your project into orbit.</p>

      <!-- Payment Container -->
      <div class="section-container fade-in delay-3">
        
        <!-- Order Summary -->
        <div class="order-summary">
          <div class="summary-item">
            <span>Website Development & SEO</span>
            <span>$499.00</span>
          </div>
          <div class="summary-item">
            <span>Setup Fee</span>
            <span>$0.00</span>
          </div>
          <div class="summary-item total">
            <span>Total Due</span>
            <span>$499.00</span>
          </div>
        </div>

        <!-- Payment Form -->
        <form class="payment-form" onsubmit="event.preventDefault(); alert('Payment gateway integration required (e.g., Stripe, PayPal).');">
          
          <h3 class="section-title">Billing Details</h3>
          
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" required>
          </div>

          <h3 class="section-title" style="margin-top: 1rem;">Payment Information</h3>

          <div class="form-group">
            <label for="card">Card Number</label>
            <input type="text" id="card" placeholder="0000 0000 0000 0000" maxlength="19" required>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="expiry">Expiry Date</label>
              <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
            </div>
            <div class="form-group">
              <label for="cvc">CVC</label>
              <input type="text" id="cvc" placeholder="123" maxlength="4" required>
            </div>
          </div>

          <div class="form-group">
            <label for="zip">Billing Zip Code</label>
            <input type="text" id="zip" placeholder="12345" maxlength="10" required>
          </div>

          <button type="submit" class="cta-button">Pay Now</button>
        </form>

        <!-- Security Note -->
        <div class="secure-note">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
          <span>Payments are secured with 256-bit SSL encryption.</span>
        </div>

      </div>

      <a href="index.html" class="back-link fade-in delay-3">&larr; Return to Homepage</a>
    </main>

    <footer> &copy; 2026 Boostinger. All rights reserved. </footer>
  </body>
</html>
